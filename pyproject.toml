[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "macro-rus-dashboard"
version = "0.1.0"
description = "Region-first dashboard for Russian PIT, fiscal, and industrial indicators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "altair>=5.3,<6",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "PyYAML>=6,<7",
  "streamlit>=1.40,<2",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<7",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
macro-rus = "macro_rus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_rus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["macro_rus"]
